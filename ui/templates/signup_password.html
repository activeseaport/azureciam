{% extends "base.html" %}
{% block title %}Set a password{% endblock %}
{% block content %}
<h1>Set a password</h1>
<p class="sub">Your email is verified. Choose a password to finish signing up.</p>
<form method="post" action="{{ url_for('signup_next') }}">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" placeholder="Create a password" autocomplete="new-password" required autofocus>
  <button type="submit">Continue</button>
</form>
{% include "_flash_messages.html" %}
{% endblock %}
