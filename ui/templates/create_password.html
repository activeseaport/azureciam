{% extends "base.html" %}
{% block title %}New password{% endblock %}
{% block content %}
<h1>Choose a new password</h1>
<p class="sub">This may take a few seconds to apply.</p>
<form method="post" action="{{ url_for('reset_password') }}">
  <label for="password">New password</label>
  <input id="password" name="password" type="password" placeholder="Enter new password" autocomplete="new-password" required autofocus>
  <button type="submit">Update password</button>
</form>
{% include "_flash_messages.html" %}
{% endblock %}
